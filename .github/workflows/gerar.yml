name: Gerar InvestPop

on:
  schedule:
    - cron: '*/30 13-20 * * 1-5'  # A cada 30min, 10:00-17:30 BRT (UTC-3)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Gerar página
        run: node gerar.js --no-open

      - name: Preparar deploy
        run: |
          mkdir -p _site
          cp pages/*.html _site/
          cp assets/*.js _site/
          cp assets/robots.txt _site/
          cp assets/sitemap.xml _site/
          cp assets/og-image.svg _site/
          echo "investpop.com.br" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
